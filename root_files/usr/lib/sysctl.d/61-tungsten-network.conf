# TCP BBR with fair queueing (fq paces the packets): higher throughput and lower latency on
# lossy links (Wi-Fi, Tailscale exit node) than cubic. Both modules are loaded at boot
# (modules-load.d/tungsten-bbr.conf): services may not load modules on demand.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
