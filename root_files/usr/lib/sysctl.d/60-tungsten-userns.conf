# linux-hardened's switch for unprivileged user namespaces (default off). They stay
# allowed here: SELinux decides per domain who may create one (Trivalent's sandbox,
# bubblewrap for Flatpak), see selinux/tungsten.te. Setting this to 0 at runtime
# (run0 sysctl kernel.unprivileged_userns_clone=0) blocks them all at once, e.g. while
# a user namespace vulnerability is unpatched; Flatpak and Trivalent stop working then.
kernel.unprivileged_userns_clone = 1
