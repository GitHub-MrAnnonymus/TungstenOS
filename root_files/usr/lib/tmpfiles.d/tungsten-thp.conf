# Transparent huge pages for the programs that ask for them (madvise: games, JIT runtimes,
# Java), compacted in the background instead of stalling the program (as CachyOS).
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
# khugepaged merges a range into a huge page when at most this many of its 512 pages are
# unused (default 511, which wastes memory on sparse ranges).
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
