# The login screen preselects the uwsm-managed Hyprland session until the user picks another.
f /var/cache/dms-greeter/memory.json 0644 greeter greeter - {"lastSessionDesktopId": "hyprland-uwsm.desktop"}
# Per-user login screen looks, written by root (run0 tungsten-greeter-sync), read-only for
# the login screen: no group membership or ACLs needed for the everyday account.
d /var/cache/dms-greeter/users 0750 root greeter -
