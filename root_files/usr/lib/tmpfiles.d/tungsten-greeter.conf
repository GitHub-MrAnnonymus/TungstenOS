# The login screen preselects the uwsm-managed Hyprland session until the user picks another.
f /var/cache/dms-greeter/memory.json 0644 greeter greeter - {"lastSessionDesktopId": "hyprland-uwsm.desktop"}
# The login screen's files carry the SELinux user of whoever created them; since the
# switch to user_u, files from before (staff_u) would be refused. Restore system_u.
Z /var/cache/dms-greeter - - - -
Z /var/lib/greeter - - - -
