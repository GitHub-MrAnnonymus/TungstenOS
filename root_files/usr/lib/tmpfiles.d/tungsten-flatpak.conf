# hardened_malloc inside every system-wide Flatpak, like on the host (/etc/ld.so.preload).
# host-os:ro exposes the host's /usr at /run/host/usr, read-only, for the preload.
# No Flatpak talks to the keyring directly, even if its manifest asks to: the Secret
# Service hands every unlocked secret to any client. libsecret in a sandbox then uses the
# secret portal, which gives each app only its own secrets.
# The desktop's look, read-only: GTK 4 and libadwaita load ~/.config/gtk-4.0/gtk.css
# (DankMaterialShell colors, blur), GTK 3 ~/.config/gtk-3.0/gtk.css and the adw-gtk3
# copies DMS keeps in ~/.local/share/themes.
# Rewritten at every boot; per-app exceptions go in user overrides (flatpak override --user).
d  /var/lib/flatpak/overrides         0755 root root -
f+ /var/lib/flatpak/overrides/global  0644 root root - [Context]\nfilesystems=host-os:ro;xdg-config/gtk-3.0:ro;xdg-config/gtk-4.0:ro;xdg-data/themes:ro;\n\n[Environment]\nLD_PRELOAD=/run/host/usr/lib/libhardened_malloc.so /run/host/usr/lib/libno_rlimit_as.so\nGDK_WAYLAND_DISABLE=ext_background_effect_manager_v1\n\n[Session Bus Policy]\norg.freedesktop.secrets=none\norg.gnome.keyring=none\n
# Steam reaches its data directory in /var/lib/tungsten-steam (homes are noexec; see
# /usr/share/user-tmpfiles.d/tungsten-steam.conf). Other users' directories are 0700.
f+ /var/lib/flatpak/overrides/com.valvesoftware.Steam 0644 root root - [Context]\nfilesystems=/var/lib/tungsten-steam;\n
