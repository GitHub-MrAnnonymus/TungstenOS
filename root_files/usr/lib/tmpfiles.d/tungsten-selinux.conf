# The SELinux policy store moved into the image (/usr/lib/tungsten/selinux-store);
# remove the stale copy that older installs made on first boot.
R /var/lib/selinux - - - - -
# Font caches written on the first boot before the files were labeled carry var_t, which
# applications may not map; restore their type. After a factory reset /var/cache is empty
# and the first program to write a cache created the directory as var_t (in /var/cache):
# create it here, labeled, so the caches written into it inherit its type.
d /var/cache/fontconfig 0755 root root -
Z /var/cache/fontconfig - - - -
# udisks mounts removable media in /run/media/<user>: create the parent at boot with its
# label (mnt_t, as /media), so the user folders udisks makes in it inherit that type.
d /run/media 0755 root root -
