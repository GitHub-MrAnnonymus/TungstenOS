# Recreated with new keys after a factory reset; bound to the TPM until
# tungsten-tpm-enroll switches it to the pcrlock policy.
[Partition]
Type=root
Label=root
Format=ext4
Encrypt=tpm2
FactoryReset=yes
# No user.validatefs.* attributes (nothing here uses systemd-validatefs): setting them
# mounts the new file system while repart still holds its LUKS volume open for writing,
# which bdev_allow_write_mounted=0 refuses ("Can't open blockdev"), failing the reset.
AddValidateFS=no
