# tailscaled runs as root and handles traffic from the internet: keep it to what a VPN
# needs (the tun device, routes and firewall rules, its state). Its SELinux domain is
# tailscaled_t (selinux/tungsten.te).
# Not possible in this sandbox, by design:
#  - Tailscale SSH: it starts root shells for remote users and would bypass the
#    administrator password (NoNewPrivileges, no setuid/setgid capabilities).
#  - MagicDNS rewriting /etc/resolv.conf: /etc is read-only, DNS stays with dnscrypt-proxy.
[Service]
# Firewall rules through nftables over netlink, as firewalld does, instead of running the
# iptables program: NoNewPrivileges blocks the SELinux transition into iptables_t ("fork/exec
# /usr/bin/iptables: permission denied", tailscaled exited at once), and a daemon reachable
# from the internet has no business starting programs anyway.
Environment=TS_DEBUG_FIREWALL_MODE=nftables
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
DevicePolicy=closed
DeviceAllow=/dev/net/tun rw
ProtectSystem=strict
ReadWritePaths=/var/lib/tailscale /var/cache/tailscale /run/tailscale
ProtectHome=yes
PrivateTmp=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@mount @swap @reboot @module @raw-io @obsolete
UMask=0077
