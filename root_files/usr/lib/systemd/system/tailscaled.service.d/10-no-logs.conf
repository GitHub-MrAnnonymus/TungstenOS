# No client logs to Tailscale's log servers (log.tailscale.com): their telemetry, used for
# support (https://tailscale.com/kb/1011/log-mesh-network-activity). Tailscale may not be
# able to help with problems then. To send them anyway, set TS_NO_LOGS_NO_SUPPORT=false in
# /etc/default/tailscaled: the unit's EnvironmentFile= wins over this.
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
