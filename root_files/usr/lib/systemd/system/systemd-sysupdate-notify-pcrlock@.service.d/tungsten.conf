# systemd-sysupdate notifies this service after every completed update (updatectl and
# the timer alike); it recomputes the TPM policy. Predict the new UKIs first, so the
# policy covers them before the reboot into the update.
#
# Upstream passes --location=770, which fits only the initrd; the running system then
# cannot satisfy the stored policy to update it (see systemd-pcrlock-make-policy.service.d).
[Service]
ExecStartPre=/usr/local/lib/tungsten/pcrlock-predict
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock
