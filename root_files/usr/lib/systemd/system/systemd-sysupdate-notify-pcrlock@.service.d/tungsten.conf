# systemd-sysupdate notifies this service after every completed update (updatectl and
# the timer alike). Predict the new UKIs and recompute the TPM policy, so it covers them
# before the reboot into the update.
#
# Upstream runs "systemd-pcrlock --location=770": without a verb that is "log", which only
# prints the measurement log; and --location=770 fits only the initrd, which the running
# system cannot satisfy to update the policy (see systemd-pcrlock-make-policy.service.d).
# pcrlock-predict --make-policy refreshes only an existing policy, with the same PCRs.
[Service]
ExecStart=
ExecStart=/usr/local/lib/tungsten/pcrlock-predict --make-policy
