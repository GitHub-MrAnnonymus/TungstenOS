# Kernel modules and udev rules from system extensions must be present first.
[Unit]
After=systemd-sysext.service

# udevd started before the merge: make it re-read rules and modprobe.d (libkmod context)
# so the extensions' rules and blacklists apply to coldplug.
[Service]
ExecStartPre=-/usr/bin/udevadm control --reload
