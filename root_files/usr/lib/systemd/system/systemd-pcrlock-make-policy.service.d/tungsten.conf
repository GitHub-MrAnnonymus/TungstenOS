# Refresh only an existing policy (tungsten-tpm-enroll creates it).
[Unit]
After=tungsten-pcrlock-predict.service
ConditionPathExists=/var/lib/systemd/pcrlock.json

# Upstream passes --location=770: a policy valid only inside the initrd, which the running
# system can never satisfy when it has to update the policy (before rebooting into an
# update). pcrlock's default range (760-:940-) also covers the running system; the key
# stays initrd-only through the signed PCR 11 policy it is enrolled with as well.
# tungsten-tpm-enroll and pcrlock-predict use the same default.
#
# PCR 1 (firmware settings: boot order, CPU and memory options, some firmware updates) is
# left out of pcrlock's default PCR set: on real hardware it changes far too often, and
# each change locks the TPM out until the recovery PIN. PCRs 5 and 15 are left out too:
# pcrlock cannot predict them yet and drops them from the policy anyway; named here so
# that a systemd update fixing them does not add them unnoticed. Same list in
# pcrlock-predict and tungsten-tpm-enroll.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock make-policy --pcr=0+2+3+4+7+11+13+14
