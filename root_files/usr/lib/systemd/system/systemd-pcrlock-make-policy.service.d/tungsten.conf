# Refresh only an existing policy (tungsten-tpm-enroll creates it).
[Unit]
After=tungsten-pcrlock-predict.service
ConditionPathExists=/var/lib/systemd/pcrlock.json

# Upstream passes --location=770: a policy valid only inside the initrd, which the running
# system can never satisfy when it has to update the policy (before rebooting into an
# update). pcrlock's default range (760-:940-) also covers the running system; the key
# stays initrd-only through the signed PCR 11 policy it is enrolled with as well.
# tungsten-tpm-enroll and pcrlock-predict use the same default.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock make-policy
