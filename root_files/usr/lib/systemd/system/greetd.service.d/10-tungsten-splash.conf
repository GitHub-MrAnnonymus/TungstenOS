# Boot to login screen without the console showing in between (the pattern GDM uses):
# Plymouth's own quit service would end the splash before the greeter's compositor has
# the screen. Instead greetd lets Plymouth release the display while keeping its last
# frame (deactivate), the greeter's Hyprland takes over, and only then Plymouth quits
# with the splash retained. tty1 is cleared with the cursor hidden first, so the gaps
# between greeter and session (and at logout) are black, not text.
[Unit]
After=plymouth-start.service
Conflicts=plymouth-quit.service
After=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/sh -c 'printf "\\033[H\\033[2J\\033[3J\\033[?25l" > /dev/tty1'
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/sh -c '(sleep 3; exec /usr/bin/plymouth quit --retain-splash) &'
