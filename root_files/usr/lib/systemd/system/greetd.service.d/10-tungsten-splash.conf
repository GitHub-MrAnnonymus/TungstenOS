# Hide the console cursor on tty1, so the moments between Plymouth's retained splash and
# the login screen (and between login screen and session) show nothing but the picture.
# Plymouth itself ends through plymouth-quit.service with --retain-splash (its drop-in);
# greetd is ordered after plymouth-quit-wait.service upstream, so it must not block that.
[Service]
ExecStartPre=-/usr/bin/sh -c 'printf "\\033[?25l" > /dev/tty1'
