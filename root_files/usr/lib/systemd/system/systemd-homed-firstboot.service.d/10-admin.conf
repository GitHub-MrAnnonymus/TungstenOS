# The account created at first boot is the administrator (polkit and run0 accept wheel).
# Its home is noexec like every other writable location except system-wide Flatpak.
[Service]
ExecStart=
ExecStart=homectl firstboot --prompt-new-user --prompt-shell=no --prompt-groups=no --mute-console=yes --member-of=wheel --noexec=yes
