# First boot creates an administrator (wheel) and a separate everyday account.
[Unit]
# Every boot until the accounts exist, not only the first: if the wizard ends without
# them (power loss, a console it cannot use), the next boot asks again instead of
# leaving a system nobody can log in to. The script returns at once when homes exist.
ConditionFirstBoot=

[Service]
ExecStart=
ExecStart=/usr/lib/tungsten/firstboot-users
# Its own console: Plymouth's retained splash (plymouth-quit.service.d) leaves tty1 in
# graphics mode, where nothing written to it shows. The script switches to tty2 and back.
TTYPath=/dev/tty2
TTYReset=yes
