# systemd-modules-load starts its probe threads before it dlopen()s libkmod, which needs
# libzstd, built without shadow stack (SHSTK) support. glibc can turn the shadow stack off
# for such a library only while the process has a single thread, so the "permissive"
# default from system.conf does not help here: run it without the shadow stack.
# (selinux/tungsten.te lets the variable through the domain transition.)
[Service]
Environment=GLIBC_TUNABLES=glibc.cpu.x86_shstk=off:glibc.cpu.x86_ibt=on
