# Wi-Fi scans through wpa_supplicant, which NetworkManager otherwise only requests over
# D-Bus (activation of fi.w1.wpa_supplicant1). That activation did not happen on a
# TungstenOS laptop, and the device stayed "unavailable" with no scan results: start it
# together with NetworkManager instead.
[Unit]
Wants=wpa_supplicant.service
After=wpa_supplicant.service
