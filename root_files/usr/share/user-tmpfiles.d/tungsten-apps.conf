# Flatpak apps that run programs they download themselves keep them in
# /var/lib/tungsten-apps/<uid>/<app id> instead of the noexec home; links in the app's
# Flatpak home point there. Created at every login. L+ replaces what is in the way: on
# TungstenOS nothing there could ever run.
d  /var/lib/tungsten-apps/%U                                            0700 - - -
# VSCodium: extensions bring language servers, debuggers and other native programs.
d  /var/lib/tungsten-apps/%U/com.vscodium.codium                        0700 - - -
d  /var/lib/tungsten-apps/%U/com.vscodium.codium/extensions             0700 - - -
L+ %h/.var/app/com.vscodium.codium/data/codium/extensions  -  - - - /var/lib/tungsten-apps/%U/com.vscodium.codium/extensions
