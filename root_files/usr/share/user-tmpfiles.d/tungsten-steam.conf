# Steam (Flatpak) keeps its client and games in /var/lib/tungsten-steam/<uid>: homes are
# noexec, and Steam runs programs from its data directory. Created at every login; the
# links in Steam's Flatpak home point its data there (the wrapper looks at
# ~/.var/app/com.valvesoftware.Steam/data/Steam and ~/.steam/steam).
# L+ replaces what is in the way: on TungstenOS Steam never ran from the home, so only an
# unpacked bootstrap can be there.
d  /var/lib/tungsten-steam/%U                                0700 - - -
L+ %h/.var/app/com.valvesoftware.Steam/data/Steam            -    - - - /var/lib/tungsten-steam/%U
L+ %h/.var/app/com.valvesoftware.Steam/.local/share/Steam    -    - - - /var/lib/tungsten-steam/%U
L+ %h/.var/app/com.valvesoftware.Steam/.steam/steam          -    - - - /var/lib/tungsten-steam/%U
