<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- TungstenOS: Manrope for the interface, JetBrains Mono for code and terminals. Apps
     without their own font setting (Qt, Electron, browsers) follow these defaults; the
     usual families stay as fallbacks for other scripts and symbols. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Manrope</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Manrope</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
