# Containers run in gVisor (runsc), an application kernel: their code never talks to the
# host kernel directly. The image has no other runtime (build.sh removes crun).
[containers]
# Podman would label the container (container_t) and relabel volumes; gVisor does not
# apply SELinux labels, and runsc runs in the Podman domain.
label = false

[engine]
runtime = "runsc"

[engine.runtimes]
runsc = ["/usr/lib/tungsten/runsc"]
