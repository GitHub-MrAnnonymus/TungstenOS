# Image layers through fuse-overlayfs: the kernel (linux-hardened) does not allow
# overlayfs in user namespaces (CONFIG_OVERLAY_FS_UNPRIVILEGED is off; it has had many
# privilege escalation bugs), so rootless Podman cannot use the kernel's overlay.
# A drop-in: Arch's own (/usr/share/containers/storage.rootless.conf.d) sets the driver,
# and drop-ins win over a user's storage.conf.
[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
