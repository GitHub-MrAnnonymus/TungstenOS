[main]
# resolv.conf points at dnscrypt-proxy.
dns=none
rc-manager=unmanaged

[device]
wifi.scan-rand-mac-address=yes

# Generic USB Ethernet (cdc_ether, cdc_ncm: many adapters and docks) and phone tethering
# keep their own MAC address. A changed address only applies on the computer side: the
# device still filters for its own, drops the DHCP reply sent to the random one, and the
# connection never gets an IPv4 address. NetworkManager takes the first section that
# matches, so this one comes before the general default below.
[connection-usb-ethernet]
match-device=driver:cdc_ether,driver:cdc_ncm,driver:rndis_host,driver:ipheth
ethernet.cloned-mac-address=permanent

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
connection.stable-id=${CONNECTION}/${BOOT}
