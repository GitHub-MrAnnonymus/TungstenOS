# GPU drivers early: the graphics driver takes over the firmware framebuffer before the
# splash starts, keeping its mode, instead of seconds into the real system, where the
# takeover and Plymouth moving to the new device each blanked the screen. Intel (i915, and
# xe from Lunar Lake on) and AMD (amdgpu), which drive the panels of laptops with hybrid
# graphics too. Not the kms hook: nouveau would add NVIDIA's large GSP firmware (NVIDIA
# systems use the proprietary driver from the extension), radeon only GPUs before ~2012.
MODULES=(erofs overlay i915 xe amdgpu)
BINARIES=()
FILES=()
HOOKS=(base systemd plymouth microcode modconf keyboard sd-vconsole block sd-verity sd-encrypt filesystems tungsten fsck)
