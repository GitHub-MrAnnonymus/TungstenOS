# Additions to the vendored secureblue blocklists.

# Intel ME: the interface to the Management Engine (mei, mei_me) stays available, for
# fwupd only (/dev/mei0 is root-only, and SELinux gives it to fwupd_t): it reads the ME
# and BootGuard state for the HSI report and installs Intel CSME security updates. Intel
# Arc loads parts of its firmware through it (GSC proxy). Content protection is not needed.
install mei_hdcp /bin/false
install mei_pxp /bin/false

install eepro100 /bin/false
install evbug /bin/false
install kyrofb /bin/false
install nvidiafb /bin/false
install tdfxfb /bin/false
