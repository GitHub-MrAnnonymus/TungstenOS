# Compressed swap in RAM; TungstenOS has no swap on disk. zram-size is the uncompressed
# capacity: zstd usually compresses desktop memory 3-4x, so a full device as large as the
# RAM occupies about a quarter to a third of it (16 GiB of RAM: about 4-5 GiB) and the
# system holds roughly 1.5x its RAM. systemd-oomd steps in before it fills.
[zram0]
zram-size = min(ram, 16384)
compression-algorithm = zstd
swap-priority = 100
