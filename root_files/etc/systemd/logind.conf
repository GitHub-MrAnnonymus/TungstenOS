[Login]
# No suspend or hibernation (the sleep targets are masked): a suspended system keeps
# its disk keys in RAM. Closing the lid locks the session instead.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
# Logging out kills every process of the user, so the user manager stops and systemd-homed
# deactivates the home (unmounts it and closes its LUKS volume, discarding the key).
KillUserProcesses=yes
IdleAction=poweroff
IdleActionSec=1800
