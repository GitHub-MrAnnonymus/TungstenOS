dev.tty.ldisc_autoload=0
fs.binfmt_misc.status=0
fs.protected_fifos=2
fs.protected_regular=2
fs.suid_dumpable=0
kernel.core_pattern=|/bin/false
kernel.nmi_watchdog=0
kernel.dmesg_restrict=1
kernel.kexec_load_disabled=1
kernel.kptr_restrict=2
kernel.perf_event_paranoid=3
kernel.printk=3 3 3 3
kernel.sysrq=0
kernel.unprivileged_bpf_disabled=1
kernel.yama.ptrace_scope=2
net.core.bpf_jit_harden=2
net.ipv4.conf.*.accept_redirects=0
net.ipv4.conf.*.accept_source_route=0
# Loose reverse path filtering (systemd's default): strict mode dropped the replies to
# tailscaled's own packets while an exit node routes everything through its table, so
# traffic stalled; it breaks policy-routed VPNs (Tailscale, WireGuard) in general and adds
# little on a single-homed laptop. Spoofed sources are still dropped when unreachable.
net.ipv4.conf.*.rp_filter=2
net.ipv4.conf.*.secure_redirects=0
net.ipv4.conf.*.send_redirects=0
net.ipv4.icmp_echo_ignore_all=1
# SACK, D-SACK, FACK and timestamps stay at the kernel defaults (on). Old hardening guides
# turned them off (the 2019 SACK panic, fixed long ago; timestamps leaking uptime, random per
# connection since 4.10). Without them TCP recovers from loss slowly: through a VPN exit node
# a few lost packets after a burst of new connections stalled all traffic for seconds.
net.ipv4.tcp_rfc1337=1
net.ipv4.tcp_syncookies=1
net.ipv6.conf.*.accept_ra=0
net.ipv6.conf.*.accept_redirects=0
net.ipv6.conf.*.accept_source_route=0
net.ipv6.conf.*.use_tempaddr=2
vm.max_map_count=1048576
vm.dirty_writeback_centisecs=6000
vm.mmap_rnd_bits=32
vm.mmap_rnd_compat_bits=16
# The only swap is zram (compressed RAM, never on disk), so swapping out early is cheap
# and leaks nothing to storage. Kernel docs: values over 100 suit zram. No readahead from it.
vm.swappiness=180
vm.page-cluster=0
vm.unprivileged_userfaultfd=0

# From secureblue's 55-hardening.conf (@ 4282b5f)
kernel.io_uring_disabled=2
kernel.oops_limit=100
kernel.warn_limit=100
kernel.panic=-1
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv6.icmp.echo_ignore_all=1
net.ipv4.conf.*.shared_media=0
net.ipv4.conf.*.arp_filter=1
net.ipv4.conf.*.arp_ignore=2
net.ipv4.conf.*.drop_gratuitous_arp=1
net.ipv4.conf.*.log_martians=1
fs.protected_hardlinks=1
fs.protected_symlinks=1
kernel.randomize_va_space=2
# Performance without a security cost (as CachyOS): directory and inode caches kept longer,
# and writeback earlier in smaller pieces, so large writes do not stall the system.
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=3
net.core.netdev_max_backlog=4096
