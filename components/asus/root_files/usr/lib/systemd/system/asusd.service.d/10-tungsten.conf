# Enabled unconditionally by the extension (asusd.service is static); start only on ASUS.
[Unit]
ConditionFirmware=smbios-field(sys_vendor $= ASUS*)

# Upstream sets SELinuxContext=...:unconfined_t, which this policy has no transition to
# (exec fails with 229/SELINUX_CONTEXT). Run in the default service domain instead.
[Service]
SELinuxContext=
