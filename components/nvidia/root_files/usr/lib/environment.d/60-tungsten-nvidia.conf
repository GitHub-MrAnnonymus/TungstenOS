# Vulkan programs see only the integrated GPU's drivers: loading the NVIDIA driver to list
# devices wakes the discrete GPU from its power-saving state, and many programs do that
# just by starting. nvidia-offload <program> selects the NVIDIA GPU.
# The loader skips the files that are not present: AMD or Intel, and Mesa names them with
# or without the architecture depending on the build.
VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json:/usr/share/vulkan/icd.d/radeon_icd.x86_64.json:/usr/share/vulkan/icd.d/intel_icd.json:/usr/share/vulkan/icd.d/intel_icd.x86_64.json
