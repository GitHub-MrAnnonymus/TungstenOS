name: Build packages

on:
  push:
    branches: [master, main]
    paths:
      - kernel/**
      - packages/**
      - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every package group
        type: boolean
        default: false
      groups:
        description: Groups to rebuild (kernel selinux misc); used by the Update workflow
        type: string
        default: ''

permissions:
  contents: write
  actions: write

# Runs that publish to the same release must not overlap; later runs wait.
concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      kernel: ${{ steps.plan.outputs.kernel }}
      selinux: ${{ steps.plan.outputs.selinux }}
      misc: ${{ steps.plan.outputs.misc }}
    steps:
      - run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm git python gnupg zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - id: plan
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          all=${{ github.event_name == 'workflow_dispatch' && inputs.all || false }}
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ALL)
          has() { [ "$all" = true ] || [ "$changed" = ALL ] || grep -qE "$1" <<<"$changed"; }
          kernel=false; selinux=false; misc=false
          has '^kernel/(PKGBUILD|config\.(base|fragment|slim)|patches/|patch-overrides/)' && kernel=true
          has '^packages/(build-selinux\.sh|refpolicy-user-exec-content\.sh|archlinuxhardened\.asc|erofs-utils-selinux/)' && selinux=true
          has '^packages/(trivalent|hardened_malloc|greetd-dms-greeter|usbguard-notifier|quickshell|no_rlimit_as)/' && misc=true
          groups="${{ github.event_name == 'workflow_dispatch' && inputs.groups || '' }}"
          if [ -n "$groups" ]; then
            # Explicit groups (from the Update workflow or a manual run) replace change detection.
            kernel=false; selinux=false; misc=false
            for g in $groups; do
              case $g in kernel|selinux|misc) printf -v "$g" true ;; esac
            done
          fi
          echo "kernel=$kernel selinux=$selinux misc=$misc"
          { echo "kernel=$kernel"; echo "selinux=$selinux"; echo "misc=$misc"; } >> "$GITHUB_OUTPUT"

  kernel:
    needs: plan
    if: needs.plan.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:latest
      # Free disk space by deleting the host's preinstalled SDKs.
      options: -v /usr/share/dotnet:/host/dotnet -v /usr/local/lib/android:/host/android -v /opt/ghc:/host/ghc -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/toolcache/* && df -h /
      - run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm base-devel git sudo ccache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Saved even on failure, so a timed-out first build still warms the cache.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: kernel-ccache-${{ github.run_id }}
          restore-keys: kernel-ccache-
      - name: Build linux-tungsten
        shell: bash
        timeout-minutes: 330   # leave time for the cache save below
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 6G
          CCACHE_BASEDIR: ${{ github.workspace }}/kernel/src
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder .
          sudo -u builder --preserve-env=CCACHE_DIR,CCACHE_MAXSIZE,CCACHE_BASEDIR,CCACHE_COMPILERCHECK,CCACHE_SLOPPINESS bash -euo pipefail <<'EOF'
          ccache -z
          gpg --batch --import kernel/keys/torvalds.asc kernel/keys/gregkh.asc
          cd kernel
          makepkg -s --noconfirm
          ccache -s
          EOF
      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: kernel-ccache-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: kernel, path: kernel/*.pkg.tar.zst, retention-days: 1 }

  selinux:
    needs: plan
    if: needs.plan.outputs.selinux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: archlinux:latest
    steps:
      - name: Enable multilib (systemd-selinux needs lib32-gcc-libs)
        run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm base-devel git sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build SELinux packages
        shell: bash
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder ./packages/build-selinux.sh out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: selinux, path: out/*.pkg.tar.zst, retention-days: 1 }

  misc:
    needs: plan
    if: needs.plan.outputs.misc == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm base-devel git sudo python gnupg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build small packages
        shell: bash
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder bash -euo pipefail <<'EOF'
          (cd packages/trivalent && makepkg -s --noconfirm)
          (cd packages/hardened_malloc && makepkg -s --noconfirm)
          (cd packages/greetd-dms-greeter && makepkg -s --noconfirm)
          gpg --batch --import packages/usbguard-notifier/*.asc
          (cd packages/usbguard-notifier && makepkg -s --noconfirm)
          (cd packages/quickshell && makepkg -s --noconfirm)
          (cd packages/no_rlimit_as && makepkg -s --noconfirm)
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: misc
          path: |
            packages/trivalent/*.pkg.tar.zst
            packages/hardened_malloc/*.pkg.tar.zst
            packages/greetd-dms-greeter/*.pkg.tar.zst
            packages/usbguard-notifier/*.pkg.tar.zst
            packages/quickshell/*.pkg.tar.zst
            packages/no_rlimit_as/*.pkg.tar.zst

  publish:
    needs: [plan, kernel, selinux, misc]
    # Signing secrets live in the 'release' environment, which only master can use.
    environment: release
    # Publish every group that built, even if another group failed.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && (needs.kernel.result == 'success' || needs.selinux.result == 'success' || needs.misc.result == 'success') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm github-cli gnupg pacman-contrib git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: new, merge-multiple: true }
      - name: Sign packages and update the repo database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TUNGSTEN_GPG_KEY: ${{ secrets.TUNGSTEN_GPG_KEY }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          export GNUPGHOME=$(mktemp -d)
          echo "$TUNGSTEN_GPG_KEY" | base64 -d | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')

          mkdir repo
          # Carry over packages from groups not rebuilt in this run.
          gh release view packages >/dev/null 2>&1 || gh release create packages --prerelease --latest=false \
            --title "Package repository" --notes "pacman repo [tungsten]. Not an OS release."
          gh release download packages --dir repo --pattern '*.pkg.tar.zst*' --pattern 'tungsten.db*' --pattern 'tungsten.files*' || :
          for f in repo/tungsten.db repo/tungsten.files; do [ -f "$f" ] && mv "$f" "$f.tar.zst"; done
          rm -f repo/tungsten.db.sig repo/tungsten.files.sig

          # Artifacts keep their source folders. A published file never changes: a
          # rebuild of a version that is already published is dropped (only a new
          # version publishes new bytes). Debug packages are skipped.
          rm -f repo/*-debug-*.pkg.tar.zst*
          find new -name '*.pkg.tar.zst' ! -name '*-debug-*' -print0 | while IFS= read -r -d '' p; do
            if [ -e "repo/$(basename "$p")" ]; then
              echo "already published, keeping it: $(basename "$p")"; continue
            fi
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "$p.sig" "$p"
            mv -f "$p" "$p.sig" repo/
          done
          cd repo
          # Rebuilt from the files present, so the database always matches them.
          rm -f tungsten.db.tar.zst tungsten.files.tar.zst
          repo-add --remove --sign --key "$KEY" tungsten.db.tar.zst ./*.pkg.tar.zst
          for sig in ./*.pkg.tar.zst.sig; do [ -e "${sig%.sig}" ] || rm -f "$sig"; done
          # Release assets can't be symlinks.
          for f in tungsten.db tungsten.files; do
            rm -f "$f" "$f.sig"
            cp "$f.tar.zst" "$f"; cp "$f.tar.zst.sig" "$f.sig"
          done
          # Packages first, database last: a client never sees a database that lists
          # packages not uploaded yet.
          gh release upload packages --clobber ./*.pkg.tar.zst ./*.pkg.tar.zst.sig
          gh release upload packages --clobber tungsten.files tungsten.files.sig tungsten.db tungsten.db.sig
          # Only now remove packages the new database no longer lists.
          for asset in $(gh release view packages --json assets -q '.assets[].name'); do
            [ -e "$asset" ] || gh release delete-asset packages "$asset" -y
          done

      # The image build is started explicitly, so it also runs after package
      # builds started by the Update workflow.
      - name: Build OS images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
