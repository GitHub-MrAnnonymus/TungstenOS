name: Hyprland CFI trial

# Builds packages/hyprland with Clang CFI (TUNGSTEN_CFI in its PKGBUILD) as a workflow
# artifact only: never published to the [tungsten] repository, never in an image.
# Run it nested on an up-to-date Arch (the libraries must match the ones built against):
#   bsdtar -xf hyprland-*.pkg.tar.zst -C ~/hyprland-cfi usr/bin
#   ~/hyprland-cfi/usr/bin/Hyprland 2> ~/cfi.txt     (from inside a Wayland session)
#   grep -A2 'control flow integrity' ~/cfi.txt | sort | uniq -c
on:
  workflow_dispatch:
    inputs:
      mode:
        description: diagnose (report and keep running) or trap (stop on a failed check)
        type: choice
        options: [diagnose, trap]
        default: diagnose

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: |
          printf 'Server = %s/$repo/os/$arch\n' https://fastly.mirror.pkgbuild.com https://geo.mirror.pkgbuild.com https://mirror.rackspace.com/archlinux https://mirrors.kernel.org/archlinux > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm base-devel git sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        shell: bash
        env:
          TUNGSTEN_CFI: ${{ inputs.mode }}
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder --preserve-env=TUNGSTEN_CFI bash -euo pipefail -c \
            'cd packages/hyprland && makepkg -s --noconfirm'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyprland-cfi-${{ inputs.mode }}
          path: packages/hyprland/hyprland-[0-9]*.pkg.tar.zst
