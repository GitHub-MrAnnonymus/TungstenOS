# System user and group IDs of the image, enforced by scripts/pin-system-ids.sh after the
# packages are installed. systemd-sysusers numbers them in the order of the sysusers.d
# files, so adding or removing one package's user renumbers others; their files in /var
# on installed systems then belong to the wrong account (greeter 961 -> 964 when QEMU
# moved into the virt extension). A new system user gets a build warning: add it here.
# Seeded from release 202611142131. Static IDs below 100 come from the packages.
#
# u <user> <uid> / g <group> <gid>
u systemd-coredump 979
u systemd-imds 978
u systemd-network 977
u systemd-oom 976
u systemd-journal-remote 975
u systemd-resolve 974
u systemd-timesync 973
u tss 972
u uuidd 971
u alpm 969
u avahi 968
u flatpak 967
u fwupd 966
u git 965
u greeter 964
u passim 963
u pcscd 962
u polkitd 102
g adm 999
g wheel 998
g empower 997
g utmp 996
g audio 995
g clock 994
g disk 993
g input 992
